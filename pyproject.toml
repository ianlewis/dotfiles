[project]
name = "dotfiles"
version = "0.0.0"
# NOTE: this should match the major/minor version in .python-version.
requires-python = ">=3.14"
dependencies = [
    "ansible==14.5.0",
    "hashin==1.0.5",
    "python-lsp-server==1.15.0",
    "python-lsp-ruff==2.3.4",
    "ruff==0.17.1",
    "yamllint==1.38.0",
    "zizmor==1.31.1",
]

[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

# This is required to prevent setuptools from trying to find packages in the
# current directory.
[tool.setuptools.packages.find]
include = []
